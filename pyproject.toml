[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scout-cli"
version = "0.1.0"
description = "Codebase context for LLMs, zero waste"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Hari Prasad", email = "hariprasad6055@gmail.com" }]
keywords = ["llm", "context", "codebase", "indexing", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/hriprsd/scout"
Repository = "https://github.com/hriprsd/scout"
Issues = "https://github.com/hriprsd/scout/issues"

[project.scripts]
scout = "scout.cli:main"

[tool.setuptools.packages.find]
include = ["scout*"]
